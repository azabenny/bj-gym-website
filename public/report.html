<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report a Problem</title><link rel="stylesheet" href="/style.css"></head><body><nav><div class="logo">BJ GYM</div><div><a href="/index.html">Home</a><a href="/register.html">Join</a></div></nav><section class="section"><h1>Suggestion & Problem Report</h1><p>Help us improve BJ Gym by reporting broken equipment or sharing suggestions.</p><form id="form"><div class="fields"><div><label>Your Name</label><input name="client_name"></div><div><label>Phone</label><input name="phone"></div><div><label>Category *</label><select name="category"><option>Broken Equipment</option><option>Cleanliness</option><option>Facility Problem</option><option>Suggestion</option><option>Other</option></select></div><div><label>Equipment / Location</label><input name="equipment" placeholder="e.g. Treadmill #3"></div></div><label>Description *</label><textarea name="description" required></textarea><button class="btn">SEND REPORT</button><div class="status" id="status"></div></form></section><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const s=document.getElementById('status');const data=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();s.textContent=j.success?'✅ Thank you. Your report has been sent to BJ Gym staff.':'❌ '+j.error;if(j.success)e.target.reset()}</script></body></html>
