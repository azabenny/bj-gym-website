<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports</title><link rel="stylesheet" href="/admin/style.css"></head><body><div class="top"><b>BJ GYM SYSTEM</b><div class="nav"><a href="/admin/dashboard.html">Dashboard</a><a href="/admin/clients.html">Clients</a><a href="/admin/settings.html">Payment Accounts</a><a href="#" onclick="bjLogout()">Logout</a></div></div><main class="container"><h1>Problem & Suggestion Reports</h1><table><thead><tr><th>Client</th><th>Category</th><th>Equipment</th><th>Description</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></main>
<script src="/admin/common.js"></script>
<script>async function load(){let d=await fetch('/api/reports').then(r=>r.json());rows.innerHTML=d.map(x=>`<tr><td>${x.client_name||'-'}</td><td>${x.category}</td><td>${x.equipment||'-'}</td><td>${x.description}</td><td><select onchange="update(${x.id},this.value)"><option ${x.status==='Pending'?'selected':''}>Pending</option><option ${x.status==='In Progress'?'selected':''}>In Progress</option><option ${x.status==='Resolved'?'selected':''}>Resolved</option></select></td></tr>`).join('')}async function update(id,status){await fetch('/api/reports/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}load()</script></body></html>
