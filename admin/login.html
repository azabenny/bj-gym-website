<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BJ Gym Staff Login</title><link rel="stylesheet" href="/admin/style.css"></head><body><div class="login"><h1>BJ GYM</h1><p>Admin & Registrar Login</p><form id="f"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>LOGIN</button><div class="status" id="s"></div></form><small>Demo Admin: admin / admin123</small></div><script>f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(j.success){localStorage.setItem('bjUser',JSON.stringify(j.user));location='/admin/dashboard.html'}else s.textContent=j.error}</script></body></html>
