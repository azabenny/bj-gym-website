<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physical Registration</title><link rel="stylesheet" href="/admin/style.css"></head><body><div class="top"><b>BJ GYM SYSTEM</b><div class="nav"><a href="/admin/dashboard.html">Dashboard</a><a href="/admin/clients.html">Clients</a><a href="/admin/settings.html">Payment Accounts</a><a href="#" onclick="bjLogout()">Logout</a></div></div><main class="container"><h1>Physical / Cash-Desk Registration</h1><p>Use this when a client is standing in front of you and paying cash right now. They are activated immediately — no approval step needed.</p><form id="f" class="card"><input name="full_name" placeholder="Full Name *" required><input name="phone" placeholder="Phone *" required><input name="email" placeholder="Email"><select name="gender"><option>Prefer not to say</option><option>Male</option><option>Female</option></select><input name="age" type="number" placeholder="Age"><input name="address" placeholder="Address"><select name="fitness_goal"><option>General Fitness</option><option>Weight Loss</option><option>Muscle Building</option><option>Strength</option></select><select name="package_name" id="packageSelect" required><option>Loading packages...</option></select><input name="duration" type="number" min="1" step="1" placeholder="Membership months (enter manually) *" required><label>Client Photo (Optional)</label><input id="photo" type="file" accept="image/*"><button>REGISTER CLIENT</button><div id="s"></div></form></main>
<script src="/admin/common.js"></script>
<script>
const toDataURL=f=>new Promise((resolve,reject)=>{if(!f)return resolve('');const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});fetch('/api/packages').then(r=>r.json()).then(ps=>packageSelect.innerHTML=ps.map(p=>`<option value="${p.name}">${p.name} — ${Number(p.price).toLocaleString()} ETB / ${p.duration} mo.</option>`).join(''));f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));d.client_photo=await toDataURL(photo.files[0]);let r=await fetch('/api/clients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();s.textContent=j.success?'✅ Client registered and activated.':'❌ '+j.error;if(j.success)f.reset()}
</script></body></html>
